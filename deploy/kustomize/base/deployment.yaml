# Settings come from the ConfigMap `symposium-config` and the Secret `symposium-secrets`,
# both defined per environment in the overlays.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: symposium
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: symposium
  template:
    metadata:
      labels:
        app: symposium
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Applies database migrations before the new version starts serving.
        - name: migrate
          image: ghcr.io/ziinez/symposiumform:latest
          imagePullPolicy: Always
          command: ["node", "dist/migrate.mjs"]
          envFrom:
            - secretRef:
                name: symposium-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
      containers:
        - name: symposium
          image: ghcr.io/ziinez/symposiumform:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: symposium-config
            - secretRef:
                name: symposium-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: next-cache
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
