# Copy to symposium-secrets.yaml (git-ignored), fill in, then run ./seal.sh.
apiVersion: v1
kind: Secret
metadata:
  name: symposium-secrets
  namespace: symposium-prod
type: Opaque
stringData:
  # From the CBC (old Postgres server). Add ?sslmode=verify-full if the server uses TLS.
  DATABASE_URL: postgres://USER:PASSWORD@HOST:5432/DATABASE
  # openssl rand -base64 48
  BETTER_AUTH_SECRET: REPLACE_ME
  # SMTP service account from the CBC; it sends as lustrumsymposium@gewis.nl.
  SMTP_USER: REPLACE_ME
  SMTP_PASS: REPLACE_ME
  # npm run admin:credentials (only the hashes go here)
  ADMIN_USERNAME_SHA256: REPLACE_ME
  ADMIN_PASSWORD_HASH: REPLACE_ME
